name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Describe it below. The more context you give, the easier it is to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where you run into a limitation today.
      placeholder: When I have many expenses I can't filter by category, so I have to scroll through everything...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
      placeholder: A category filter chip row above the expense list that narrows results in place.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      multiple: true
      options:
        - Frontend (UI / UX)
        - Slip scanning / Claude extraction
        - Expense management (CRUD)
        - Image processing (resize / storage)
        - API design
        - Data model / schema
        - Infrastructure / Docker
        - Developer experience
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would use it regularly
        - Blocking my workflow
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you use today, or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples from other apps, related issues — anything helpful.
